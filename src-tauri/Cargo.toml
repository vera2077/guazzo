[package]
name = "guazzo"
version = "0.70.0"
edition = "2021"
description = "Guazzo — a fully-offline, Photoshop-like image editor"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
serde = { version = "1", features = ["derive"] }
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
tauri-runtime = "2"

[profile.release]
opt-level = "s"
lto = true
strip = true
