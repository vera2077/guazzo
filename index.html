<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Guazzo</title>
  <style>
    :root {
      color-scheme: dark;
      --bg: #141519;
      --bg-deep: #0e0f12;
      --panel: #1f222a;
      --panel-2: #262a33;
      --panel-3: #2f343f;
      --stroke: rgba(255, 255, 255, .075);
      --stroke-strong: rgba(255, 255, 255, .14);
      --text: #e7e9ee;
      --muted: #98a0ae;
      --accent: #5b8cff;
      --accent-soft: rgba(91, 140, 255, .16);
      --accent-line: rgba(91, 140, 255, .42);
      --radius: 12px;
      --radius-sm: 8px;
      --radius-xs: 6px;
      --shadow: 0 1px 2px rgba(0, 0, 0, .4), 0 10px 26px -18px rgba(0, 0, 0, .9);
    }

    html, body {
      margin: 0; height: 100%;
      background: var(--bg-deep); color: var(--text);
      font: 12px/1.45 "Segoe UI Variable Text", "Segoe UI", system-ui, sans-serif;
      overflow: hidden; user-select: none; -webkit-user-select: none;
    }

    #app {
      display: grid; height: 100%;
      grid-template-rows: 42px minmax(30px, auto) 30px 1fr 22px;
      grid-template-columns: var(--toolbar-w, 50px) 1fr auto;
      grid-template-areas:
        "topbar topbar topbar"
        "options options options"
        "tabs tabs tabs"
        "toolbar canvas panels"
        "statusbar statusbar statusbar";
    }

    /* ---------- chrome ---------- */
    #topbar {
      grid-area: topbar; display: flex; align-items: center; gap: 2px;
      /* no right padding: the caption buttons own the last pixels of the row */
      padding: 0 0 0 8px; background: var(--panel); border-bottom: 1px solid var(--stroke);
      position: relative; z-index: 300; min-height: 42px;
    }
    #brand {
      display: flex; align-items: center; gap: 8px; padding: 0 12px 0 4px;
      flex: none; white-space: nowrap;
      font-weight: 650; letter-spacing: .01em; font-size: 13px;
    }
    /* the title-strip mark is the app icon itself (vector twin of icon.png) */
    #brand .mark { display: inline-flex; flex: none; filter: drop-shadow(0 1px 2px rgba(0, 0, 0, .35)); }
    #brand .mark svg { display: block; }
    #brand small { color: var(--muted); font-weight: 400; font-size: 11px; }

    #options {
      grid-area: options; display: flex; align-items: center; flex-wrap: nowrap; gap: 6px;
      min-height: 30px; padding: 3px 12px; background: var(--panel-2);
      border-bottom: 1px solid var(--stroke); white-space: nowrap;
    }

    /* options-bar paging: hosts are invisible layout shells */
    .opt-page { display: contents; }
    /* controls live here and this is the only part allowed to overflow …
       min-width:0 is what lets a flex child shrink below its content width */
    .opt-host {
      display: flex; align-items: center; flex-wrap: nowrap; gap: 6px 12px;
      flex: 1 1 auto; min-width: 0; overflow: hidden;
    }
    /* … while the pager + help sit outside it and stay pinned right, always */
    .opt-tail { display: flex; align-items: center; gap: 6px; flex: none; padding-left: 6px; }
    .opt-tail .btn { flex: none; }

    /* ---- frameless window chrome (desktop build) ------------------------- */
    /* Caption buttons: inset pills with a 4px gap to the window edge, so the
       hover shape reads as a button instead of a block bleeding into the corner.
       z-index sits above the resize grips (350) or the top-right grip would
       swallow the hover/clicks of the close button. */
    .topfind {
  display: flex;
  align-items: center;
  flex: none;
  margin-left: 8px;
}

.winctl {
      display: flex; align-items: center; gap: 2px; height: 100%; flex: none;
      margin-left: 8px; padding-right: 4px; position: relative; z-index: 400;
    }
    .winbtn {
      width: 42px; height: calc(100% - 10px); padding: 0; border: 0;
      border-radius: var(--radius-xs); background: transparent; color: var(--muted);
      display: inline-flex; align-items: center; justify-content: center; cursor: default;
    }
    .winbtn:hover { background: rgba(255, 255, 255, .07); color: var(--text); }
    .winbtn:active { background: rgba(255, 255, 255, .13); }
    /* close: a lighter step of the same neutral hover — it stays obviously the
       close button from its glyph, without a red block in a dark app */
    .winbtn.danger:hover { background: rgba(255, 255, 255, .14); color: var(--text); }
    .winbtn.danger:active { background: rgba(255, 255, 255, .2); }
    /* invisible grips: native resize gestures, never on top of the controls */
    .rs-edge { position: fixed; z-index: 60; } /* below menus (320) and window buttons (400) */
    .rs-w { left: 0; top: 0; bottom: 0; width: 5px; }
    .rs-e { right: 0; top: 0; bottom: 0; width: 5px; }
    .rs-s { left: 0; right: 0; bottom: 0; height: 5px; }
    .rs-nw { left: 0; top: 0; width: 10px; height: 10px; }
    .rs-ne { right: 0; top: 0; width: 10px; height: 10px; }
    .rs-sw { left: 0; bottom: 0; width: 10px; height: 10px; }
    .rs-se { right: 0; bottom: 0; width: 10px; height: 10px; }

    /* floating in-editor palette (Adjustments) — not an OS window */
    .float-win {
      position: fixed;
      z-index: 450;
      display: flex;
      flex-direction: column;
      background: var(--panel);
      border: 1px solid var(--stroke-strong);
      border-radius: var(--radius);
      box-shadow: var(--shadow);
      overflow: hidden;
    }
    .float-head {
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 7px 8px 7px 12px;
      border-bottom: 1px solid var(--stroke);
      cursor: grab;
      user-select: none;
      touch-action: none;
    }
    .float-head:active { cursor: grabbing; }
    .float-head b {
      font-size: 10px;
      text-transform: uppercase;
      letter-spacing: 0.09em;
      color: var(--muted);
    }
    .float-close { margin-left: auto; width: 22px; height: 22px; }
    .float-body {
      display: flex;
      flex-direction: column;
      gap: 9px;
      padding: 10px;
      max-height: min(60vh, 460px);
      overflow-y: auto;
    }
    .pal-body select { width: 100%; flex: none; }
    .pal-form { display: flex; flex-direction: column; gap: 6px; }
    .pal-form .inline-row input[type="range"] { width: auto; flex: 1 1 auto; min-width: 70px; }
    .pal-form .label { white-space: normal; overflow-wrap: anywhere; }
    .pal-curve { width: 100%; height: 150px; background: var(--bg-deep); border: 1px solid var(--stroke); border-radius: var(--radius-sm); cursor: crosshair; touch-action: none; }

    #tabs {
      grid-area: tabs; display: flex; align-items: stretch; gap: 2px;
      padding: 0 8px; background: var(--bg); border-bottom: 1px solid var(--stroke);
      overflow-x: auto;
    }
    #tabs::-webkit-scrollbar { height: 0; }
    .tab {
      display: inline-flex; align-items: center; gap: 6px; max-width: 200px;
      padding: 0 6px 0 12px; margin-top: 4px;
      border-radius: 9px 9px 0 0; background: var(--panel);
      color: var(--muted); cursor: pointer; white-space: nowrap; font-size: 12px;
    }
    .tab:hover { color: var(--text); }
    .tab.active { background: var(--panel-3); color: #fff; }
    .tab.dirty { font-style: normal; }
    .tab.dirty.active { color: #fff; }
    .tab.dirty:not(.active) { color: #cfd6e4; }
    .status-dirty { color: #f0b429; }
    .status-details {
      height: 18px; padding: 0 7px; border: 1px solid var(--stroke);
      border-radius: 9px; background: var(--panel-2); color: var(--muted);
      font: inherit; font-size: 10px; cursor: pointer;
    }
    .status-details:hover { color: var(--text); border-color: var(--stroke-strong); }
    .import-lead { margin: 0 0 8px; color: var(--text); line-height: 1.45; }
    .import-report { min-width: 360px; }
    .import-count { padding: 2px 0; color: var(--text); }
    .import-all { margin-top: 10px; border-top: 1px solid var(--stroke); padding-top: 8px; }
    .import-all summary { cursor: pointer; color: var(--accent); }
    .import-all ul { margin: 6px 0 0; padding-left: 18px; max-height: 260px; overflow: auto; }
    .import-all li { margin: 3px 0; color: var(--muted); line-height: 1.4; }
    input.num {
      width: 46px; padding: 2px 4px; text-align: right;
      background: var(--panel-2); color: var(--text);
      border: 1px solid var(--stroke); border-radius: var(--radius-xs);
      font-size: 11px; font-variant-numeric: tabular-nums;
      -moz-appearance: textfield;
    }
    input.num::-webkit-outer-spin-button, input.num::-webkit-inner-spin-button { -webkit-appearance: none; margin: 0; }
    /* focus styling for number fields lives with the global :focus-visible rule */
    .row .thumb {
      flex: none; width: 26px; height: 20px; border-radius: 4px;
      border: 1px solid var(--stroke-strong); background:
        repeating-conic-gradient(#2a2f3a 0% 25%, #21252d 0% 50%) 50% / 8px 8px;
      image-rendering: pixelated;
    }
    .row .lockbtn {
      flex: none; display: flex; padding: 2px; border-radius: 4px;
      color: var(--muted); opacity: 0; cursor: pointer;
    }
    .row:hover .lockbtn, .row .lockbtn.on { opacity: .9; }
    .row .lockbtn:hover { background: var(--panel-3); color: var(--text); }
    .row .lockbtn.on { color: #f0b429; }
    .row input.rename {
      flex: 1 1 auto; min-width: 0; padding: 1px 4px; font: inherit;
      background: var(--bg-deep); color: var(--text);
      border: 1px solid var(--accent-line); border-radius: var(--radius-xs);
    }
    .row input.rename:focus { outline: none; }
    .status-hint { color: var(--accent); }
    /* export dialog body (src/ui/exportdlg.ts) — previously referenced but
       undefined classes; styled so the dialog reads as intended (T6) */
    .expdlg { min-width: 380px; }
    .exp-note { display: block; margin: 2px 0 8px; }
    .exp-size { display: block; margin: 8px 0; }
    .exp-warn { display: block; margin-top: 8px; color: #d9a441; }
    @media (prefers-reduced-motion: reduce) {
      .flash { animation: none; }
    }
    .ndlg-error {
      grid-column: 1 / -1; min-height: 15px; margin-top: 4px;
      font-size: 11px; color: #ff8f8f;
    }
    .tab .close {
      display: flex; align-items: center; justify-content: center;
      min-width: 18px; min-height: 18px; padding: 3px; border-radius: 5px; color: var(--muted);
    }
    .tab .close:hover { background: #b8393f; color: #fff; }
    .tab .close .ico { width: 12px; height: 12px; }
    .newtab {
      display: flex; align-items: center; justify-content: center; width: 28px;
      margin: 4px 0 0 2px; border: 0; border-radius: 9px;
      background: transparent; color: var(--muted); cursor: pointer;
    }
    .newtab:hover { background: var(--panel); color: var(--text); }

    #toolbar {
      grid-area: toolbar; display: flex; flex-direction: column;
      background: var(--panel);
      border-right: 1px solid var(--stroke); overflow: hidden;
      position: relative; width: var(--toolbar-w, 50px);
    }
    /* tool buttons live in their own scroller, between the pinned top toggle
       and the pinned colour row (v0.25.3) */
    .tool-area {
      flex: 1 1 auto; min-height: 0; overflow-y: auto;
      display: flex; flex-direction: column; align-items: center;
      gap: 2px; padding: 6px 0; scrollbar-width: none;
    }
    .tool-area::-webkit-scrollbar { width: 0; }
    /* two compact columns: a strict grid keeps both columns aligned (v0.25.1) */
    #toolbar.wrap .tool-area {
      display: grid; grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 2px 0; padding: 6px 2px; align-content: start;
    }
    #toolbar.wrap .tool-area .tool { width: auto; height: 32px; }
    #toolbar.wrap .tool-area .tool-sep { grid-column: 1 / -1; width: auto; margin: 3px 4px; }
    #toolbar-grip {
      position: absolute; top: 0; right: -3px; width: 7px; height: 100%;
      cursor: ew-resize; z-index: 5;
    }
    #toolbar-grip:hover::after, #toolbar-grip.drag::after {
      content: ""; position: absolute; inset: 0 3px; background: var(--accent);
      border-radius: 2px; opacity: .55;
    }
    /* size button = small pinned TOP toggle: > widens to two columns,
       < folds back to one (v0.25.3) */
    #toolbar .toolbar-size {
      width: 100%; height: 22px; flex: none; padding: 0;
      display: flex; align-items: center; justify-content: center;
      background: var(--panel); border-bottom: 1px solid var(--stroke);
      border-radius: 0;
    }
    #toolbar .toolbar-size:hover { background: var(--panel-3); }

    .tool {
      width: 36px; height: 34px; flex: none;
      display: flex; align-items: center; justify-content: center;
      border: 0; border-radius: var(--radius-sm); background: transparent;
      color: #c3c9d4; cursor: pointer; transition: background .12s, color .12s;
    }
    .tool:hover { background: var(--panel-3); color: #fff; }
    .tool.active {
      background: var(--accent-soft); color: #dbe7ff;
      box-shadow: inset 0 0 0 1px var(--accent-line);
    }
    .tool-sep { width: 22px; height: 1px; margin: 5px 0; background: var(--stroke); flex: none; }

    #statusbar {
      grid-area: statusbar; display: flex; align-items: center; gap: 16px;
      padding: 0 12px; background: var(--panel); border-top: 1px solid var(--stroke);
      font-size: 11px; color: var(--muted); font-variant-numeric: tabular-nums;
    }
    #statusbar .grow-spacer { flex: 1 1 auto; }
    #statusbar b { color: #cfd5df; font-weight: 600; }

    /* ---------- menu bar ---------- */
    @media (max-width: 1100px) {
      #brand small { display: none; }
      #brand { padding-right: 4px; }
    }
    #menubar {
      display: flex; align-items: center; gap: 1px; margin-right: auto; padding-left: 4px;
      flex: none;
    }
    .menu { position: relative; flex: none; }
    .menu-btn {
      appearance: none; border: 0; background: none; color: var(--text);
      font: inherit; font-size: 12.5px; padding: 5px 9px; border-radius: var(--radius-xs);
      cursor: default; letter-spacing: .01em; white-space: nowrap; flex: none;
    }
    .menu-btn:hover { background: rgba(255, 255, 255, .07); }
    .menu-btn.open { background: var(--panel-3); }
    .menu-pop {
      position: absolute; top: calc(100% + 5px); left: 0; min-width: 228px; z-index: 320;
      max-height: min(72vh, 620px); overflow-y: auto; overscroll-behavior: contain;
      display: none; flex-direction: column; padding: 5px;
      background: var(--panel-2); border: 1px solid var(--stroke-strong);
      border-radius: var(--radius-sm); box-shadow: var(--shadow);
    }
    /* right-click context menus: same look as the menubar pops, fixed at cursor.
     * .menu-pop above is display:none and only .menu.open > .menu-pop shows —
     * a context pop is a bare body child with no .menu wrapper, so it MUST
     * carry its own display rule or it never renders. */
    .context-pop {
      display: flex; flex-direction: column;
      position: fixed; z-index: 500;
      max-height: min(72vh, 620px); overflow-y: auto; overscroll-behavior: contain;
      box-shadow: 0 12px 32px rgba(0, 0, 0, .45);
    }
    /* AA3: the live preview runs on a downscaled proxy, so the canvas says so. */
    .preview-badge {
      position: absolute; left: 10px; bottom: 10px; z-index: 60; padding: 3px 8px;
      border-radius: 999px; background: rgba(20, 22, 28, .82);
      border: 1px solid var(--stroke-strong); color: var(--muted);
      font-size: 10.5px; letter-spacing: .02em; pointer-events: none;
      opacity: 0; transform: translateY(4px);
      transition: opacity .12s ease, transform .12s ease;
    }
    .preview-badge.on { opacity: 1; transform: translateY(0); }
    .menu.open > .menu-pop { display: flex; }
    .menu-sep { height: 1px; margin: 4px 6px; background: var(--stroke); }
    .menu-head {
      padding: 6px 10px 3px; font-size: 10px; letter-spacing: .09em;
      text-transform: uppercase; color: var(--muted);
    }
    .menu-item {
      position: relative; display: flex; align-items: center; gap: 8px;
      padding: 6px 9px; border-radius: var(--radius-xs); font-size: 12.5px;
      cursor: default; white-space: nowrap;
    }
    .menu-item:hover { background: var(--accent-soft); }
    .menu-item.disabled { opacity: .38; pointer-events: none; }
    .menu-item .mi-ico { width: 14px; height: 14px; flex: none; color: var(--muted); display: flex; }
    .menu-item .mi-label { flex: 1 1 auto; }
    .menu-item .key { color: var(--muted); font-size: 11px; padding-left: 18px; }
    .menu-sub {
      top: -5px; left: calc(100% + 2px); min-width: 212px;
    }
    /* JS places the side menu at the row's right edge. It must be FIXED: the
       pops scroll (overflow-y:auto) and would clip an absolute child, which is
       why the Blending submenu used to be invisible. */
    .menu-item.sub.open > .menu-sub { display: flex; position: fixed; z-index: 520; }

    /* ---------- tooltip ---------- */
    .tooltip {
      position: fixed; z-index: 90; pointer-events: none;
      max-width: 320px; padding: 6px 9px; font-size: 11.5px; line-height: 1.35;
      color: var(--text); background: var(--panel-3);
      border: 1px solid var(--stroke-strong); border-radius: var(--radius-xs);
      box-shadow: var(--shadow); opacity: 0; transform: translateY(-2px);
      transition: opacity .12s ease, transform .12s ease;
      white-space: pre-line;
    }
    .tooltip.show { opacity: 1; transform: none; }

    /* ---------- new document dialog ---------- */
    .ndlg { display: grid; grid-template-columns: minmax(0, 1fr) 168px; gap: 14px; }
    .ndlg-main { display: flex; flex-direction: column; gap: 8px; min-width: 0; }
    .ndlg-aside { display: flex; flex-direction: column; gap: 8px; }
    .ndlg .grid2 { display: grid; grid-template-columns: 92px minmax(0, 1fr) 88px; gap: 8px; align-items: center; }
    .ndlg .grid2 > .label { text-align: right; }
    .ndlg .grid2 .pair { display: flex; gap: 8px; }
    .ndlg .grid2 .pair > input { flex: 1 1 auto; min-width: 0; }
    .ndlg .grid2 .pair > select { flex: 0 0 88px; }
    .ndlg .grid1 { display: grid; grid-template-columns: 92px minmax(0, 1fr); gap: 8px; align-items: center; }
    .ndlg .grid1 > .label { text-align: right; }
    .ndlg .group {
      border: 1px solid var(--stroke); border-radius: var(--radius-sm);
      padding: 9px 11px 11px; display: flex; flex-direction: column; gap: 8px;
    }
    .ndlg .group-title { font-size: 10.5px; letter-spacing: .08em; text-transform: uppercase; color: var(--muted); }
    .ndlg .readout { font-size: 11.5px; color: var(--muted); margin-top: auto; }
    .ndlg .readout b { color: var(--text); font-weight: 600; }
    .ndlg .swatch { width: 100%; height: 26px; border-radius: var(--radius-xs); border: 1px solid var(--stroke-strong); }
    .ndlg input[type="text"], .ndlg input[type="number"], .ndlg select { width: 100%; }
    .ndlg .btn { justify-content: center; }

    /* ---------- helper dialogs ---------- */
    .shortcuts { display: grid; gap: 2px; max-height: 60vh; overflow: auto; }
    .shortcut-row {
      display: flex; align-items: center; gap: 12px; padding: 4px 2px; font-size: 12.5px;
    }
    .shortcut-row kbd {
      flex: none; min-width: 132px; padding: 2px 6px; font: inherit; font-size: 11.5px;
      color: var(--text); background: var(--panel-3); border: 1px solid var(--stroke-strong);
      border-radius: var(--radius-xs); text-align: center;
    }
    .shortcut-row span { color: var(--muted); }
    .about-link {
  display: flex; align-items: baseline; gap: 8px; width: 100%;
  margin-top: 8px; padding: 8px 10px; text-align: left; cursor: pointer;
  font: inherit; color: var(--text); background: var(--panel-2);
  border: 1px solid var(--stroke); border-radius: var(--radius-sm);
}
.about-link:hover { background: var(--panel-3); border-color: var(--stroke-strong); }
.about-link .al-main { font-weight: 600; }
.about-link .al-hint { color: var(--muted); font-size: 11px; }
.about .notices { max-height: min(58vh, 460px); margin: 0; }
.about p { margin: 0 0 10px; font-size: 12.5px; line-height: 1.5; }
    .about p.label { color: var(--muted); font-size: 11.5px; margin-bottom: 0; white-space: normal; overflow-wrap: anywhere; }
    .inline-row.check { gap: 7px; cursor: default; }
    .inline-row.check input { accent-color: var(--accent); margin: 0; }
    .flash { animation: flashpulse .9s ease; }
    @keyframes flashpulse {
      0% { box-shadow: 0 0 0 0 var(--accent-line); }
      35% { box-shadow: 0 0 0 3px var(--accent-line); }
      100% { box-shadow: none; }
    }

    #canvas-host {
      grid-area: canvas; position: relative; overflow: hidden;
      background:
        radial-gradient(circle at 50% 40%, #1a1c21 0%, #101115 70%);
      cursor: crosshair;
    }
    #canvas-host canvas { position: absolute; inset: 0; }

    /* ---------- panels ---------- */    #panels {
      grid-area: panels; position: relative; display: flex; flex-direction: column;
      gap: 8px; padding: 8px; background: var(--bg);
      border-left: 1px solid var(--stroke);
      overflow-y: auto; overflow-x: hidden;
      width: 276px; min-width: 210px; max-width: 560px;
    }
    #panels.panel-hidden { display: none; }
    #toolbar.toolbar-hidden { display: none; }
    .panel-grip {
      position: absolute; left: 0; top: 0; bottom: 0; width: 7px; z-index: 5;
      cursor: ew-resize;
    }
    .panel-grip::after {
      content: ""; position: absolute; left: 0; top: 0; bottom: 0; width: 1px;
      background: transparent; transition: background .12s;
    }
    .panel-grip:focus-visible { outline: none; }
    .panel-grip:focus-visible::after { background: var(--accent); }
    .panel-grip:hover::after, .panel-grip:active::after { background: var(--accent-line); }
    .card-grip {
      position: relative; flex: none; height: 8px; margin: 0;
      cursor: ns-resize; z-index: 3;
    }
    .card-grip:focus-visible { outline: none; }
    .card-grip:focus-visible::after { background: var(--accent); }
    .card-grip::after {
      content: ""; position: absolute; left: 50%; bottom: 3px; width: 34px; height: 2px;
      transform: translateX(-50%); border-radius: 2px; background: rgba(255,255,255,.14);
      transition: background .12s;
    }
    .card-grip:hover::after { background: var(--accent); }
    .card {
      display: flex; flex-direction: column; min-height: 0; overflow: hidden;
      background: var(--panel); border: 1px solid var(--stroke);
      border-radius: var(--radius); box-shadow: var(--shadow); flex: none;
    }
    .card.grow { flex: 1 1 auto; min-height: 132px; }
    .card.grow.collapsed { flex: 0 0 auto; min-height: 0; }
    .card-head {
