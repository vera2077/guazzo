name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  gate:
    # Windows, because the smoke suite, the pins and the shipped artifact are
    # all defined against this platform. The gate itself is pure Node: tsc,
    # the single-file bundler, 598 tests, ui-smoke and a deterministic rebuild.
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22.x'
      - name: install
        run: |
          corepack enable
          pnpm install --frozen-lockfile --ignore-scripts
      - name: gate (tests, pins, smoke, deterministic build)
        run: node scripts/ci.mjs
