name: release gate

# This is a RELEASE GATE, not a publisher. It checks that the dispatched commit
# passes the same gate as any push. It does not build, stage, sign, package,
# verify assets, or upload anything.
#
# The exe cannot be reproduced in CI: the PE header carries a linker timestamp,
# so a runner-built binary is a different file from the one staged and verified
# locally. installer/assets/payload.bin is committed at the manifest commit and
# verify-asset.mjs requires the shipped payload to equal it, so a workflow that
# rebuilt the exe and restaged a release folder could only fail. Releases are
# cut by hand, from the locally staged folder; see docs/PUBLISH.md.
#
# Manual dispatch only: a tag push must not run this job. Every action is pinned
# to a commit SHA so a mutable tag cannot move a step off the reviewed code.
on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-gate-${{ github.ref }}
  cancel-in-progress: false

jobs:
  gate:
    # Review gate for running the check, not for uploading assets — this job
    # has no write permission and no publish step.
    environment: release
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
          persist-credentials: false

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "22.x"

      - name: Install
        run: |
          corepack enable
          pnpm install --frozen-lockfile --ignore-scripts

      - name: Gate
        run: node scripts/ci.mjs
